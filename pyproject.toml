[project]
name = "basketball_ml"
version = "0.1.0"
description = "Machine learning on NBA data: statistical twins, projections and predictions"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "matplotlib>=3.7"]

[project.scripts]
basketball-ml = "basketball_ml.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
