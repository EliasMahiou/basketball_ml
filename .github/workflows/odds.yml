name: odds archive

# The NBA's odds feed only shows today's and the next few games, so this saves it several
# times a day on the odds-archive branch: each game's last odds before tip-off can then
# score the live predictions (see basketball_ml.predictions.live.closing_odds).
on:
  schedule:
    - cron: "0 15,19,22,23,0,1,2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odds-archive

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: odds-archive
      - name: Save the odds feed
        shell: bash
        run: |
          stamp=$(date -u +%Y-%m-%dT%H%MZ)
          curl -fsS --retry 3 --max-time 60 \
            https://nba-prod-us-east-1-mediaops-stats.s3.amazonaws.com/NBA/liveData/odds/odds_todaysGames.json \
            | gzip -9 > "odds/$stamp.json.gz"
          python3 -c 'import gzip, json, sys; assert "games" in json.load(gzip.open(sys.argv[1]))' "odds/$stamp.json.gz"
          echo "$stamp.json.gz" >> odds/index.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add odds
          git commit -q -m "Odds snapshot $stamp"
          git push -q origin HEAD:odds-archive
